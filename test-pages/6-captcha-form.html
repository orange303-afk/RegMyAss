<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Тест 6: Имитация CAPTCHA</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 32px; width: 360px; }
    label { display: block; font-size: 13px; color: #94a3b8; margin: 12px 0 4px; }
    input { width: 100%; box-sizing: border-box; background: #0f172a; border: 1px solid #334155; padding: 10px 12px; border-radius: 8px; color: #fff; font-size: 14px; }
    .captcha-card { margin-top: 16px; padding: 14px; background: #222938; border: 1px solid #3b4252; border-radius: 8px; display: flex; align-items: center; gap: 12px; }
    .captcha-checkbox { width: 22px; height: 22px; cursor: pointer; accent-color: #6366f1; }
    button[type="submit"] { width: 100%; margin-top: 20px; background: #6366f1; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="box">
    <h2 style="margin:0 0 16px 0;">Регистрация с проверкой</h2>
    <form onsubmit="event.preventDefault(); alert('Форма отправлена!');">
      <label>Email</label>
      <input type="email" name="email" required />

      <label>Пароль</label>
      <input type="password" name="password" required />

      <!-- reCAPTCHA v2 mock -->
      <div class="g-recaptcha captcha-card">
        <input type="checkbox" id="captcha-box" class="captcha-checkbox" onchange="toggleCaptcha(this)" />
        <label for="captcha-box" style="margin:0; cursor:pointer; color:#fff; font-size:13px;">Я не робот (нажмите для решения)</label>
      </div>
      <textarea id="g-recaptcha-response" name="g-recaptcha-response" style="display:none;"></textarea>

      <button type="submit" id="submit-btn">Отправить</button>
    </form>
  </div>

  <script>
    function toggleCaptcha(cb) {
      const resp = document.getElementById('g-recaptcha-response');
      if (cb.checked) {
        resp.value = "mock_captcha_token_" + Date.now();
      } else {
        resp.value = "";
      }
    }
  </script>
</body>
</html>
