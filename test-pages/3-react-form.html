<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Тест 3: React Controlled Form</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 32px; width: 360px; }
    .badge { display: inline-block; padding: 4px 8px; background: #312e81; color: #a5b4fc; border-radius: 6px; font-size: 11px; margin-bottom: 12px; }
    label { display: block; font-size: 13px; color: #94a3b8; margin: 12px 0 4px; }
    input { width: 100%; box-sizing: border-box; background: #0f172a; border: 1px solid #334155; padding: 10px 12px; border-radius: 8px; color: #fff; font-size: 14px; }
    button { width: 100%; margin-top: 20px; background: #6366f1; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .state-view { margin-top: 16px; padding: 10px; background: #090d16; border-radius: 6px; font-family: monospace; font-size: 11px; color: #38bdf8; }
  </style>
</head>
<body>
  <div class="box">
    <span class="badge">React Synthetic Form Mock</span>
    <h2 style="margin:0 0 16px 0;">Sign Up</h2>
    <div id="react-root">
      <label>Email Address</label>
      <input type="email" id="react-email" placeholder="you@company.com" autocomplete="email" />

      <label>Password</label>
      <input type="password" id="react-password" placeholder="Password" autocomplete="new-password" />

      <button id="react-submit" disabled>Create Account (requires non-empty state)</button>

      <div class="state-view" id="state-view">
        State: { email: "", password: "" }
      </div>
    </div>
  </div>

  <script>
    const state = { email: "", password: "" };
    const emailInput = document.getElementById('react-email');
    const passInput = document.getElementById('react-password');
    const submitBtn = document.getElementById('react-submit');
    const stateView = document.getElementById('state-view');

    function update() {
      stateView.textContent = 'State: ' + JSON.stringify(state);
      if (state.email && state.password) {
        submitBtn.disabled = false;
      } else {
        submitBtn.disabled = true;
      }
    }

    emailInput.addEventListener('input', (e) => {
      state.email = e.target.value;
      update();
    });

    passInput.addEventListener('input', (e) => {
      state.password = e.target.value;
      update();
    });

    submitBtn.addEventListener('click', () => {
      alert('React form submitted successfully with state: ' + JSON.stringify(state));
    });
  </script>
</body>
</html>
