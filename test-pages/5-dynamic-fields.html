<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Тест 5: Динамическая модальная форма</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .btn-open { background: #6366f1; color: #fff; border: none; padding: 14px 28px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); align-items: center; justify-content: center; }
    .modal { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 32px; width: 350px; position: relative; }
    label { display: block; font-size: 13px; color: #94a3b8; margin: 12px 0 4px; }
    input { width: 100%; box-sizing: border-box; background: #0f172a; border: 1px solid #334155; padding: 10px 12px; border-radius: 8px; color: #fff; font-size: 14px; }
    button[type="submit"] { width: 100%; margin-top: 20px; background: #10b981; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .close-btn { position: absolute; top: 12px; right: 12px; background: transparent; border: none; color: #94a3b8; font-size: 18px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Демонстрационный сайт со скачиванием</h1>
  <p style="color:#94a3b8;">Для скачивания файла необходимо зарегистрироваться.</p>
  <button class="btn-open" onclick="openModal()">Скачать файл (Требуется регистрация)</button>

  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal">
      <button class="close-btn" onclick="closeModal()">✕</button>
      <h2 style="margin:0 0 16px 0;">Регистрация в модальном окне</h2>
      <form onsubmit="event.preventDefault(); alert('Готово!'); closeModal();">
        <label>Email</label>
        <input type="email" name="email" required />

        <label>Пароль</label>
        <input type="password" name="password" required />

        <button type="submit">Создать аккаунт</button>
      </form>
    </div>
  </div>

  <script>
    function openModal() {
      document.getElementById('modal-overlay').style.display = 'flex';
    }
    function closeModal() {
      document.getElementById('modal-overlay').style.display = 'none';
    }
  </script>
</body>
</html>
