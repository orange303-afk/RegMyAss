<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Тест 2: Форма с подтверждением пароля</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 32px; width: 360px; }
    h2 { margin-top: 0; font-size: 20px; color: #fff; }
    label { display: block; font-size: 13px; color: #94a3b8; margin: 12px 0 4px; }
    input[type="text"], input[type="email"], input[type="password"] { width: 100%; box-sizing: border-box; background: #0f172a; border: 1px solid #334155; padding: 10px 12px; border-radius: 8px; color: #fff; font-size: 14px; }
    .check-row { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 12px; color: #94a3b8; }
    button { width: 100%; margin-top: 20px; background: #6366f1; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    button:hover { background: #4f46e5; }
    .success { display: none; margin-top: 16px; padding: 12px; background: #064e3b; border: 1px solid #059669; color: #6ee7b7; border-radius: 8px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Быстрая регистрация</h2>
    <form id="reg-form" onsubmit="event.preventDefault(); document.getElementById('success').style.display='block';">
      <label for="reg-email">Email адрес</label>
      <input type="email" id="reg-email" name="user_email" required />

      <label for="reg-username">Имя пользователя (Логин)</label>
      <input type="text" id="reg-username" name="username" required />

      <label for="reg-pass">Пароль</label>
      <input type="password" id="reg-pass" name="password" required />

      <label for="reg-confirm">Повторите пароль</label>
      <input type="password" id="reg-confirm" name="confirm_password" required />

      <div class="check-row">
        <input type="checkbox" id="terms" name="agree_terms" required />
        <label for="terms" style="margin:0;">Я согласен с правилами сервиса</label>
      </div>

      <button type="submit" id="submit-btn">Создать учетную запись</button>
    </form>
    <div id="success" class="success">Форма успешно отправлена!</div>
  </div>
</body>
</html>
