<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Тест 1: Простая форма регистрации</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 32px; width: 340px; }
    h2 { margin-top: 0; font-size: 20px; color: #fff; }
    label { display: block; font-size: 13px; color: #94a3b8; margin: 12px 0 4px; }
    input { width: 100%; box-sizing: border-box; background: #0f172a; border: 1px solid #334155; padding: 10px 12px; border-radius: 8px; color: #fff; font-size: 14px; }
    input:focus { outline: none; border-color: #6366f1; }
    button { width: 100%; margin-top: 20px; background: #6366f1; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    button:hover { background: #4f46e5; }
    .success { display: none; margin-top: 16px; padding: 12px; background: #064e3b; border: 1px solid #059669; color: #6ee7b7; border-radius: 8px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Создать аккаунт</h2>
    <form id="signup-form" onsubmit="event.preventDefault(); document.getElementById('success').style.display='block';">
      <label for="email">Электронная почта</label>
      <input type="email" id="email" name="email" placeholder="name@domain.com" required autocomplete="email" />

      <label for="password">Пароль</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="new-password" />

      <button type="submit" id="btn-submit">Зарегистрироваться</button>
    </form>
    <div id="success" class="success">Регистрация успешно отправлена!</div>
  </div>
</body>
</html>
