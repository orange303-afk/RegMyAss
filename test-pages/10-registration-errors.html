<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Тест 10: Сайт с ошибками регистрации</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 32px; width: 340px; }
    h2 { margin-top: 0; font-size: 20px; color: #fff; }
    label { display: block; font-size: 13px; color: #94a3b8; margin: 12px 0 4px; }
    input { width: 100%; box-sizing: border-box; background: #0f172a; border: 1px solid #334155; padding: 10px 12px; border-radius: 8px; color: #fff; font-size: 14px; }
    button { width: 100%; margin-top: 20px; background: #6366f1; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .error-box { display: none; margin-top: 16px; padding: 12px; background: #4c0519; border: 1px solid #be123c; color: #fda4af; border-radius: 8px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Регистрация с проверкой домена</h2>
    <form onsubmit="handleSub(event)">
      <label>Email</label>
      <input type="email" id="email" name="email" required />

      <label>Пароль</label>
      <input type="password" id="password" name="password" required />

      <button type="submit">Зарегистрироваться</button>
    </form>
    <div id="err" class="error-box">
      Ошибка: Регистрация с одноразовых почтовых адресов запрещена на данном сайте!
    </div>
  </div>

  <script>
    function handleSub(e) {
      e.preventDefault();
      document.getElementById('err').style.display = 'block';
    }
  </script>
</body>
</html>
