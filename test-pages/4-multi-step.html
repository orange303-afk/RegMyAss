<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Тест 4: Многошаговая регистрация</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 32px; width: 360px; }
    .steps { display: flex; gap: 8px; margin-bottom: 20px; }
    .step-dot { flex: 1; height: 4px; border-radius: 2px; background: #334155; }
    .step-dot.active { background: #6366f1; }
    label { display: block; font-size: 13px; color: #94a3b8; margin: 12px 0 4px; }
    input { width: 100%; box-sizing: border-box; background: #0f172a; border: 1px solid #334155; padding: 10px 12px; border-radius: 8px; color: #fff; font-size: 14px; }
    button { width: 100%; margin-top: 20px; background: #6366f1; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="box">
    <div class="steps">
      <div id="dot1" class="step-dot active"></div>
      <div id="dot2" class="step-dot"></div>
    </div>

    <!-- Step 1 -->
    <div id="step1">
      <h2 style="margin:0;">Шаг 1: Контакты</h2>
      <label>Email</label>
      <input type="email" id="s1-email" name="email" required />

      <label>Ваше имя</label>
      <input type="text" id="s1-name" name="first_name" required />

      <button type="button" id="next-btn" onclick="nextStep()">Далее →</button>
    </div>

    <!-- Step 2 -->
    <div id="step2" style="display:none;">
      <h2 style="margin:0;">Шаг 2: Безопасность</h2>
      <label>Придумайте пароль</label>
      <input type="password" id="s2-pass" name="password" required />

      <label>Повторите пароль</label>
      <input type="password" id="s2-confirm" name="confirm_password" required />

      <button type="button" id="finish-btn" onclick="alert('Успешно завершено!')">Завершить регистрацию</button>
    </div>
  </div>

  <script>
    function nextStep() {
      document.getElementById('step1').style.display = 'none';
      document.getElementById('step2').style.display = 'block';
      document.getElementById('dot2').classList.add('active');
    }
  </script>
</body>
</html>
