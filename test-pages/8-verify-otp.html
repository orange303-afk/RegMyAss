<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Тест 8: Регистрация с OTP-кодом</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 32px; width: 340px; text-align: center; }
    h2 { margin: 0 0 8px 0; color: #fff; font-size: 20px; }
    p { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
    input.otp-input { width: 100%; box-sizing: border-box; text-align: center; letter-spacing: 6px; font-size: 24px; font-weight: bold; background: #0f172a; border: 1px solid #334155; padding: 12px; border-radius: 8px; color: #6366f1; }
    button { width: 100%; margin-top: 20px; background: #6366f1; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Введите код</h2>
    <p>Мы отправили 6-значный код подтверждения на ваш почтовый ящик.</p>
    <form onsubmit="event.preventDefault(); alert('Код ' + document.getElementById('otp').value + ' принят!');">
      <input type="text" id="otp" name="code" autocomplete="one-time-code" maxlength="6" placeholder="______" class="otp-input" required />
      <button type="submit" id="btn-verify">Подтвердить код</button>
    </form>
  </div>
</body>
</html>
