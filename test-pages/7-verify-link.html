<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Тест 7: Подтверждение по ссылке</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 32px; width: 380px; text-align: center; }
    .icon { font-size: 40px; margin-bottom: 12px; }
    h2 { margin: 0 0 10px 0; color: #fff; }
    p { font-size: 14px; color: #94a3b8; line-height: 1.5; }
    .btn-resend { margin-top: 16px; background: transparent; border: 1px solid #6366f1; color: #818cf8; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
    .btn-resend:hover { background: #6366f1; color: #fff; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">✉️</div>
    <h2>Проверьте ваш email</h2>
    <p>Мы отправили письмо со ссылкой для активации аккаунта. Перейдите по ссылке в письме, чтобы завершить регистрацию.</p>
    <button class="btn-resend" onclick="alert('Письмо отправлено повторно!')">Отправить письмо ещё раз</button>
  </div>
</body>
</html>
