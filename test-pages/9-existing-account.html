<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Тест 9: Вход для существующего аккаунта</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 32px; width: 340px; }
    h2 { margin-top: 0; font-size: 20px; color: #fff; }
    label { display: block; font-size: 13px; color: #94a3b8; margin: 12px 0 4px; }
    input { width: 100%; box-sizing: border-box; background: #0f172a; border: 1px solid #334155; padding: 10px 12px; border-radius: 8px; color: #fff; font-size: 14px; }
    button { width: 100%; margin-top: 20px; background: #10b981; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Вход в аккаунт</h2>
    <form id="login-form" onsubmit="event.preventDefault(); alert('Авторизован: ' + document.getElementById('login-email').value);">
      <label for="login-email">Email или логин</label>
      <input type="email" id="login-email" name="email" autocomplete="username" required />

      <label for="login-password">Пароль</label>
      <input type="password" id="login-password" name="password" autocomplete="current-password" required />

      <button type="submit" id="btn-login">Войти</button>
    </form>
  </div>
</body>
</html>
